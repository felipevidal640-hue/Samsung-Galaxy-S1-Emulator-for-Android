name: Build Galaxy S1 Emulator APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # GitHub's ubuntu runners ship with the Android SDK preinstalled
      # (ANDROID_HOME), including platform 34 and build-tools.
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Publish build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '## Gradle build failure' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|FAILURE|What went wrong|Execution failed|Caused by" build.log | head -n 150 >> "$GITHUB_STEP_SUMMARY" || tail -n 150 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Also publish the excerpt on a ci-logs branch so the failure is inspectable.
          {
            echo "Gradle build failed for commit $GITHUB_SHA (run $GITHUB_RUN_ID)."
            echo '```'
            grep -E "^e: |error:|FAILURE|What went wrong|Execution failed|Caused by" build.log | head -n 200 || tail -n 200 build.log
            echo '```'
          } > BUILD_ERRORS.md
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout --orphan ci-logs-tmp
          git add -f BUILD_ERRORS.md
          git commit -m "CI build errors for ${GITHUB_SHA:0:7} [skip ci]"
          git push -f origin HEAD:refs/heads/ci-logs || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyS1-Emulator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
